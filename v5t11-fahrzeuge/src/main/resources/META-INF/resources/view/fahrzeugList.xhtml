<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/fahrzeugManagement.xhtml">
  <ui:define name="content">
    <h:form id="form">

      <p:dataGrid var="fahrzeugdecoder" value="#{fahrzeugListPresenter.filteredFahrzeuge}" layout="grid" columns="4">
        <p:column>
          <p:commandLink actionListener="#{fahrzeugListPresenter.setCurrentFahrzeug(fahrzeugdecoder)}"
                         action="control"
                         ajax="false">
            <p:panelGrid styleClass="width100Percent">
              <f:facet name="header">
                <p:row>
                  <p:column>
                    <h:outputText value="#{fahrzeugdecoder.betriebsnummer}"/>
                  </p:column>
                </p:row>
              </f:facet>

              <p:row>
                <p:column styleClass="width100Percent">
                  <p:graphicImage name="#{fahrzeugListPresenter.getImage(fahrzeugdecoder)}"
                                  styleClass="fahrzeug-image"/>
                </p:column>
              </p:row>
            </p:panelGrid>
          </p:commandLink>
        </p:column>
      </p:dataGrid>
    </h:form>

    <h:outputStylesheet name="fahrzeuge.css"/>

  </ui:define>

  <ui:define name="extra">
    <h:form prependId="false">
      <h:panelGroup id="controlPanel" layout="block">
        <h:panelGroup layout="block" styleClass="controlPanel">
          <p:outputLabel style="grid-column: 1;" value="Filter: " for="fahrzeugTyp"/>
          <p:selectManyCheckbox id="fahrzeugTyp" style="grid-column: 3;" value="#{fahrzeugListPresenter.filter}">
            <f:selectItems value="#{fahrzeugListPresenter.fahrzeugTypen}"
                           var="t" itemValue="${t}" itemLabel="${t.bezeichnung}"/>
            <p:ajax update="form"/>
          </p:selectManyCheckbox>

          <p:outputLabel style="grid-column: 3;" value="... TODO: Besseres Layout ..."/>

          <p:commandButton style="grid-column: 3;" value="Neues Fahrzeug" icon="pi pi-plus-circle"
                           action="create" ajax="false"/>
        </h:panelGroup>
      </h:panelGroup>
    </h:form>
  </ui:define>

</ui:composition>

</html>
