<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/fahrzeugManagement.xhtml">
  <ui:define name="content">
    <h:form id="form">
      <h2>Neues Fahrzeug</h2>

      <h:panelGrid columns="3">
        <p:outputLabel for="@next" value="Systemtyp"/>
        <p:selectOneMenu value="#{fahrzeugListPresenter.currentFahrzeug.id.systemTyp}" id="systemTyp">
          <f:selectItems value="#{fahrzeugListPresenter.systemTypen}"/>
        </p:selectOneMenu>
        <p:fileUpload label="importieren" chooseIcon="pi pi-file-export"
                      title="Fahrzeugstammdaten aus XML-File lesen"
                      listener="#{fahrzeugListPresenter.handleFileUpload}"
                      mode="simple"
                      skinSimple="true"
                      auto="true"
                      update="@form :messages"
                      sizeLimit="100000"
                      allowTypes="/(\.|\/)xml$/"/>

        <p:outputLabel for="@next" value="Adresse"/>
        <p:inputText value="#{fahrzeugListPresenter.currentFahrzeug.id.adresse}" size="6" id="adresse" required="true"/>
        <p:commandButton value="speichern" icon="pi pi-check"
                         title="Daten speichern"
                         action="#{fahrzeugListPresenter.insertCurrentFahrzeug()}"
                         ajax="false"/>

        <p:outputLabel for="@next" value="Betriebsnummer"/>
        <p:inputText value="#{fahrzeugListPresenter.currentFahrzeug.betriebsnummer}" size="15"/>
        <p:commandButton value="abbrechen" icon="pi pi-times"
                         title="Ohne Speichern zurück"
                         action="#{fahrzeugListPresenter.cancel()}"
                         immediate="true"
                         ajax="false"/>

        <p:outputLabel for="@next" value="Fahrzeugtyp"/>
        <p:selectOneMenu value="#{fahrzeugListPresenter.currentFahrzeug.fahrzeugTyp}" id="fahrzeugTyp">
          <f:selectItems value="#{fahrzeugListPresenter.fahrzeugTypen}"/>
        </p:selectOneMenu>
      </h:panelGrid>

    </h:form>
  </ui:define>
</ui:composition>
</html>
