<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/fahrzeugManagement.xhtml">
  <ui:define name="content">
    <h:form id="form">
      <h2>Fahrzeug löschen</h2>

      <h:panelGrid columns="2">
        <p:outputLabel value="Betriebsnummer:" for="betriebsnummer"/>
        <p:inputText value="#{fahrzeugListPresenter.currentFahrzeug.betriebsnummer}" id="betriebsnummer"
                     readonly="true"/>

        <p:commandButton value="löschen" action="#{fahrzeugListPresenter.remove()}" ajax="false"/>
        <p:commandButton value="abbrechen" action="#{fahrzeugListPresenter.cancel()}" immediate="true" ajax="false"/>
      </h:panelGrid>

    </h:form>
  </ui:define>
</ui:composition>
</html>
