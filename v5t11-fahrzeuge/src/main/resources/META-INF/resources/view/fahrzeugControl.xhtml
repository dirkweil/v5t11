<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/fahrzeugManagement.xhtml">
  <ui:define name="content">
    <h:form id="fahrzeugdecoder">
      <p:toolbar>
        <f:facet name="left">
          <h:outputText value="#{fahrzeugListPresenter.currentFahrzeug.betriebsnummer}"
                        style="font-size: 30px; vertical-align: middle;"/>
          <p:graphicImage name="#{fahrzeugListPresenter.getImageOfCurrentFahrzeug()}" height="50px"
                          style="vertical-align: middle; margin-left: 20px; margin-right: 20px;"/>
          <h:outputText
              value="#{fahrzeugListPresenter.currentFahrzeug.fahrzeugdecoder.decoderAdr}"
              id="id" style="vertical-align: middle;"/>
        </f:facet>

        <f:facet name="right">
          <p:selectBooleanButton onLabel="1" offLabel="1" title="Lok-Control 1" styleClass="fahrzeugdecoder-button"
                                 value="#{lokControllerPresenter.getLokcontrollerAdapter(fahrzeugListPresenter.currentFahrzeug,0).assigned}">
            <p:ajax update="@form"/>
          </p:selectBooleanButton>
          <p:selectBooleanButton onLabel="2" offLabel="2" title="Lok-Control 2" styleClass="fahrzeugdecoder-button"
                                 value="#{lokControllerPresenter.getLokcontrollerAdapter(fahrzeugListPresenter.currentFahrzeug,1).assigned}">
            <p:ajax update="@form"/>
          </p:selectBooleanButton>

          <span class="ui-separator">
            <span class="ui-icon pi pi-ellipsis-v"/>
          </span>

          <p:menuButton value="bearbeiten" icon="pi pi-pencil" styleClass="fahrzeugdecoder-button">
            <p:menuitem value="Basisdaten" icon="pi pi-list" title="Basisdaten bearbeiten"
                        action="editBasics"
                        ajax="false"/>
            <p:menuitem value="Zugbildung" icon="pi pi-link" title="Zug bearbeiten"
                        action="editTraktion"
                        ajax="false"/>
            <p:menuitem value="Funktionen" icon="pi pi-calculator" title="Funktionszuordnung bearbeiten"
                        action="editFunktionen"
                        ajax="false"/>
            <p:menuitem value="Programmierung" icon="pi pi-wrench" title="Decoder-Konfiguration bearbeiten"
                        action="editKonfiguration"
                        ajax="false"/>

            <p:divider/>

            <p:menuitem value="Export" icon="pi pi-file-import"
                        title="Fahrzeugdefinition in XML-Datei speichern" ajax="false">
              <p:fileDownload value="#{fahrzeugListPresenter.getXmlFile(fahrzeugListPresenter.currentFahrzeug)}"/>
            </p:menuitem>
            <p:divider/>
            <p:menuitem value="Löschen" icon="pi pi-trash" title="Fahrzeug löschen"
                        action="remove"
                        ajax="false"
                        immediate="true"/>
          </p:menuButton>

          <span class="ui-separator">
            <span class="ui-icon pi pi-ellipsis-v"/>
          </span>

          <p:commandButton value="zurück" icon="pi pi-times" action="finished" ajax="false" immediate="true"/>
        </f:facet>
      </p:toolbar>

      <h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5" id="lok">
        <p:outputLabel for="lokAktiv" value="Aktiv:"/>
        <p:selectBooleanButton id="lokAktiv" value="#{fahrzeugControlPresenter.lokAktiv}" onLabel="aktiv"
                               offLabel="inaktiv" style="width:120px">
          <p:ajax/>
        </p:selectBooleanButton>

        <p:outputLabel for="lokFahrstufe" value="Fahrstufe:"/>
        <h:panelGrid id="lokFahrstufe" columns="2">
          <p:inputText id="fahrstufe" value="#{fahrzeugControlPresenter.lokFahrstufe}"/>
          <p:selectBooleanButton id="lokRueckwaerts" value="#{fahrzeugControlPresenter.lokRueckwaerts}"
                                 onLabel="rückwärts" offLabel="vorwärts" style="width:120px">
            <p:ajax/>
          </p:selectBooleanButton>
          <p:slider for="fahrstufe" minValue="0" maxValue="#{fahrzeugControlPresenter.lokMaxFahrstufe}">
            <p:ajax process="fahrstufe"/>
          </p:slider>
          <h:panelGroup/>
        </h:panelGrid>

        <c:forEach items="#{fahrzeugControlPresenter.currentFunktionsGruppen}" var="lfcg">
          <p:outputLabel value="#{lfcg.name}:"/>
          <h:panelGroup>
            <c:forEach items="#{fahrzeugControlPresenter.getLokFunktionen(lfcg)}" var="fc">
              <p:selectBooleanButton onLabel="#{fc.onLabel}" offLabel="#{fc.offLabel}" value="#{fc.aktiv}">
                <p:ajax update="lok"/>
              </p:selectBooleanButton>
            </c:forEach>
          </h:panelGroup>
        </c:forEach>
      </h:panelGrid>


    </h:form>

    <p:remoteCommand name="updateFahrzeug" update=":fahrzeugdecoder"/>
    <!--
      Das JSF-Tag funktioniert mit Quarkus/MyFaces nicht. Daher JS-Workaround.
      <f:websocket channel="fahrzeugdecoder-control" onmessage="updateFahrzeug"/>
      -->
    <h:outputScript target="body">
      let fahrzeugControlSocket = new WebSocket("ws://" + window.location.host +
          "/jakarta.faces.push/fahrzeugdecoder-control");
      fahrzeugControlSocket.onmessage = function (event) {
        updateFahrzeug();
      }
    </h:outputScript>

  </ui:define>
</ui:composition>

</html>
