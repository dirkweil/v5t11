<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/fahrzeugManagement.xhtml">
  <ui:define name="content">
    <h:form id="fahrzeugdecoder-config">
      <h:panelGrid columns="1" style="width: 100%">
        <p:toolbar>
          <f:facet name="left">
            <h:outputText value="#{fahrzeugListPresenter.currentFahrzeug.betriebsnummer}"
                          style="font-size: 30px; vertical-align: middle;"/>
            <p:graphicImage name="#{fahrzeugListPresenter.getImageOfCurrentFahrzeug()}" height="50px"
                            style="vertical-align: middle; margin-left: 20px; margin-right: 20px;"/>
            <h:outputText
                value="#{fahrzeugListPresenter.currentFahrzeug.fahrzeugdecoder.decoderAdr.adresse}@#{fahrzeugListPresenter.currentFahrzeug.fahrzeugdecoder.decoderAdr.systemTyp}"
                id="id" style="vertical-align: middle;"/>
          </f:facet>
          <f:facet name="right">
            <p:commandButton value="Speichern" icon="pi pi-save"
                             action="#{fahrzeugListPresenter.saveCurrentFahrzeug()}"
                             ajax="false"/>

            <span class="ui-separator"> <span class="ui-icon pi pi-ellipsis-v"/></span>
            <p:commandButton value="zurück" icon="pi pi-times" action="finished" ajax="false" immediate="true"/>
          </f:facet>
        </p:toolbar>

        <h:panelGrid columns="2">
          <p:outputLabel for="@next" value="Gleis:"/>
          <p:selectOneMenu id="gleis" value="#{fahrzeugPositionPresenter.currentFahrzeug.gleis}"
                           converter="#{fahrzeugPositionPresenter.gleisConverter}" style="width:125px">
            <f:selectItem itemLabel="unbekannt" itemValue="#{null}"/>
            <f:selectItems value="#{fahrzeugPositionPresenter.gleise}"
                           var="gleis" itemLabel="#{gleis.id.toString()}" itemValue="#{gleis}"/>
          </p:selectOneMenu>

          <p:outputLabel for="@next" value="Position [mm]:"/>
          <p:inputText value="#{fahrzeugListPresenter.currentFahrzeug.gleisPosition}" id="gleisPosition"/>

          <p:outputLabel for="@next" value="Richtung:"/>
          <p:selectBooleanButton id="richtung" value="#{fahrzeugListPresenter.currentFahrzeug.gleisZaehlrichtung}"
                                 onLabel="in Zählrichtung vorwärts"
                                 offLabel="in Zählrichtung rückwärts">
          </p:selectBooleanButton>

        </h:panelGrid>
      </h:panelGrid>
    </h:form>

  </ui:define>
</ui:composition>
</html>
