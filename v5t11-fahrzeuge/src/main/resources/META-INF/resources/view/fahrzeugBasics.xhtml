<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/fahrzeugManagement.xhtml">
  <ui:define name="content">
    <h:form id="fahrzeug-config">
      <h:panelGrid columns="1" style="width: 100%">
        <p:toolbar>
          <f:facet name="left">
            <h:outputText value="#{fahrzeugListPresenter.currentFahrzeug.betriebsnummer}"
                          style="font-size: 30px; vertical-align: middle;"/>
            <p:graphicImage name="#{fahrzeugListPresenter.getImageOfCurrentFahrzeug()}" height="50px"
                            style="vertical-align: middle; margin-left: 20px; margin-right: 20px;"/>
            <h:outputText
                value="#{fahrzeugListPresenter.currentFahrzeug.decoderId.adresse}@#{fahrzeugListPresenter.currentFahrzeug.decoderId.systemTyp}"
                id="id" style="vertical-align: middle;"/>
          </f:facet>
          <f:facet name="right">
            <p:commandButton value="Speichern" icon="pi pi-save"
                             action="#{fahrzeugListPresenter.saveCurrentFahrzeug()}"
                             ajax="false"/>

            <span class="ui-separator"> <span class="ui-icon pi pi-ellipsis-v"/></span>
            <p:commandButton value="zurück" icon="pi pi-times" action="finished" ajax="false" immediate="true"/>
          </f:facet>
        </p:toolbar>

        <h:panelGrid columns="2">
          <p:outputLabel for="@next" value="Beschreibung"/>
          <p:inputText value="#{fahrzeugListPresenter.currentFahrzeug.beschreibung}" size="60" id="beschreibung"/>

        </h:panelGrid>
      </h:panelGrid>
    </h:form>

    <h:form id="fahrzeug-read-write-confirm">
      <p:dialog
          header="#{fahrzeugProgramPresenter.selectedAktionsBeschreibung}"
          showEffect="fade" modal="true" widgetVar="fahrzeugReadWriteConfirm">
        <h:panelGrid columns="1">
          <h:outputText value="Das Fahrzeug muss sich alleine auf dem Programmiergleis befinden!"/>

          <h:panelGroup>
            <p:commandButton value="ok" icon="pi pi-check"
                             actionListener="#{fahrzeugProgramPresenter.execSelectedAktion()}"
                             process="@form"/>
            <p:commandButton value="abbrechen" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                             onclick="PF('fahrzeugReadWriteConfirm').hide()"/>
          </h:panelGroup>
        </h:panelGrid>
      </p:dialog>

    </h:form>
  </ui:define>
</ui:composition>
</html>
