<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/fahrzeugManagement.xhtml">
  <ui:define name="content">
    <h:form id="fahrzeugdecoder-config">
      <h:panelGrid columns="1" style="width: 100%">
        <p:toolbar>
          <f:facet name="left">
            <h:outputText value="#{fahrzeugListPresenter.currentFahrzeug.betriebsnummer}"
                          style="font-size: 30px; vertical-align: middle;"/>
            <p:graphicImage name="#{fahrzeugListPresenter.getImageOfCurrentFahrzeug()}" height="50px"
                            style="vertical-align: middle; margin-left: 20px; margin-right: 20px;"/>
            <h:outputText
                value="#{fahrzeugListPresenter.currentFahrzeug.fahrzeugdecoder.decoderAdr.adresse}@#{fahrzeugListPresenter.currentFahrzeug.fahrzeugdecoder.decoderAdr.systemTyp}"
                id="id" style="vertical-align: middle;"/>
          </f:facet>
          <f:facet name="right">
            <p:commandButton value="Speichern" icon="pi pi-save"
                             action="#{fahrzeugTraktionPresenter.saveCurrentFahrzeug()}"
                             ajax="false"/>

            <span class="ui-separator"> <span class="ui-icon pi pi-ellipsis-v"/></span>
            <p:commandButton value="zurück" icon="pi pi-times" action="finished" ajax="false" immediate="true"/>
          </f:facet>
        </p:toolbar>

        <h3>Zug mit diesem Zugfahrzeug:</h3>

        <p:pickList id="fahrzeugPicker"
                    style="height: 100%"
                    value="#{fahrzeugTraktionPresenter.fahrzeugPicker}" escapeValue="false"
                    var="betriebsnummer" itemLabel="#{betriebsnummer}" itemValue="#{betriebsnummer}"
                    transferOnCheckboxClick="true"
                    showCheckbox="true" showSourceControls="false" showTargetControls="false">
          <f:facet name="sourceCaption">Verfügbare Fahrzeuge</f:facet>
          <f:facet name="targetCaption">Angehängte Fahrzeuge</f:facet>
        </p:pickList>
      </h:panelGrid>
    </h:form>

    <h:outputStylesheet name="fahrzeuge.css"/>

  </ui:define>
</ui:composition>
</html>
