<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/fahrzeugManagement.xhtml">
  <ui:define name="content">
    <h:form id="messung-header">
      <h:panelGrid columns="1" style="width: 100%">
        <p:toolbar>
          <f:facet name="left">
            <h:outputText value="#{fahrzeugListPresenter.currentFahrzeug.betriebsnummer}"
              style="font-size: 30px; vertical-align: middle;" />
            <p:graphicImage name="#{fahrzeugListPresenter.getImageOfCurrentFahrzeug()}" height="50px"
              style="vertical-align: middle; margin-left: 20px; margin-right: 20px;" />
            <h:outputText
              value="#{fahrzeugListPresenter.currentFahrzeug.fahrzeugdecoder.decoderAdr.adresse}@#{fahrzeugListPresenter.currentFahrzeug.fahrzeugdecoder.decoderAdr.systemTyp}"
              id="id" style="vertical-align: middle;" />
          </f:facet>
          <f:facet name="right">
            <p:commandButton value="Speichern" icon="pi pi-save" action="#{gleisMessungPresenter.save()}"
              ajax="false" />

            <span class="ui-separator"> <span class="ui-icon pi pi-ellipsis-v" /></span>
            <p:commandButton value="zurück" icon="pi pi-times" action="finished" ajax="false" immediate="true" />
          </f:facet>
        </p:toolbar>
      </h:panelGrid>
    </h:form>

    <h:form id="messung-control">
      <h:panelGrid columns="1" style="width: 100%">
        <h:panelGrid columns="3">
          <p:commandButton value="Gleislängen messen" action="#{gleisMessungPresenter.selectGleislaengenMessen()}"
            disabled="#{gleisMessungPresenter.aktiv}" ajax="false" />

          <p:commandButton value="Messung abbrechen" action="#{gleisMessungPresenter.messungAbbrechen()}"
            disabled="#{!gleisMessungPresenter.aktiv}" ajax="false" />

          <h:outputText value="Status: #{gleisMessungPresenter.statusDescription}" style="font-weight: bold;" />
        </h:panelGrid>
      </h:panelGrid>
    </h:form>

    <h:panelGroup id="messung-werte" layout="block" style="width: min-content;">
      <p:dataTable var="gleis" value="#{gleisMessungPresenter.gleise}">
        <p:column headerText="Bereich" style="width: 5rem;">
          <h:outputText value="#{gleis.bereich}" />
        </p:column>

        <p:column headerText="Name" style="width: 5rem;">
          <h:outputText value="#{gleis.name}" />
        </p:column>

        <p:column headerText="Länge [mm]" style="width: 7rem; text-align: right;">
          <h:outputText value="#{gleis.laenge}" />
        </p:column>
      </p:dataTable>
    </h:panelGroup>

    <h:form id="gleis-messung-confirm">
      <p:dialog header="#{gleisMessungPresenter.selectedAktionsBeschreibung}" showEffect="fade" modal="true"
        widgetVar="gleisMessungConfirm">
        <h:panelGrid columns="1">
          <h:outputText value="#{gleisMessungPresenter.selectedAktionsAnleitung}" />

          <h:panelGroup>
            <p:commandButton value="ok" icon="pi pi-check"
              actionListener="#{gleisMessungPresenter.execSelectedAktion()}" process="@form" />
            <p:commandButton value="abbrechen" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
              onclick="PF('gleisMessungConfirm').hide()" />
          </h:panelGroup>
        </h:panelGrid>
      </p:dialog>

    </h:form>

    <p:remoteCommand name="updateGleisMessung" update=":messung-control :messung-werte" />
    <!--
      Das JSF-Tag funktioniert mit Quarkus/MyFaces nicht. Daher JS-Workaround.
      <f:websocket channel="fahrzeugdecoder-control" onmessage="updateFahrzeug"/>
      -->
    <h:outputScript target="body">
      let gleisControlSocket = new WebSocket("ws://" + window.location.host +
      "/jakarta.faces.push/fahrzeug-control");
      gleisControlSocket.onmessage = function (event) {
      updateGleisMessung();
      }
    </h:outputScript>

  </ui:define>
</ui:composition>

</html>
