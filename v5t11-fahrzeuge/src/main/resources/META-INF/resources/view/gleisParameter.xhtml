<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/v5t11.xhtml">
  <ui:param name="title" value="Gleis-Parameter"/>

  <ui:define name="content">
    <h:form id="form">
      <p:toolbar>
        <f:facet name="left">
          <h2>Gleis-Parameter</h2>
        </f:facet>

        <f:facet name="right">
          <p:commandButton value="messen" icon="pi pi-stopwatch" action="messung" ajax="false" immediate="true"/>

          <span class="ui-separator">
            <span class="ui-icon pi pi-ellipsis-v"/>
          </span>

          <p:commandButton value="speichern" icon="pi pi-save" action="#{gleisParameterPresenter.save()}" ajax="false" />
          <p:commandButton value="zurück" icon="pi pi-times" action="finished" ajax="false" immediate="true"/>
        </f:facet>
      </p:toolbar>

      <p:dataTable id="gleise" var="gleis" value="#{gleisParameterPresenter.gleise}"
                   editable="true"
                   style="margin-bottom:20px; width: min-content">

        <p:ajax event="rowEdit" listener="#{gleisParameterPresenter.onRowEdit}"/>

        <p:column headerText="Bereich" style="width: 5rem;">
          <h:outputText value="#{gleis.bereich}"/>
        </p:column>

        <p:column headerText="Name" style="width: 5rem;">
          <h:outputText value="#{gleis.name}"/>
        </p:column>

        <p:column headerText="Länge [mm]" style="width: 7rem; text-align: right;">
          <p:cellEditor>
            <f:facet name="output">
              <h:outputText value="#{gleis.laenge}"/>
            </f:facet>
            <f:facet name="input">
              <p:inputText value="#{gleis.laenge}" style="width:100%" label="Länge"/>
            </f:facet>
          </p:cellEditor>
        </p:column>

        <p:column headerText="verdeckt" style="width: 5rem; text-align: center;">
          <p:cellEditor>
            <f:facet name="output">
              <p:selectBooleanCheckbox value="#{gleis.verdeckt}" disabled="true"/>
            </f:facet>
            <f:facet name="input">
              <p:selectBooleanCheckbox value="#{gleis.verdeckt}"/>
            </f:facet>
          </p:cellEditor>
        </p:column>

        <p:column style="width:4rem">
          <p:rowEditor editTitle="Gleis bearbeiten" cancelTitle="abbrechen" saveTitle="speichern"/>
        </p:column>
      </p:dataTable>
    </h:form>

  </ui:define>


</ui:composition>

</html>
